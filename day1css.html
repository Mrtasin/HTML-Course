<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 1 CSS</title>
    <link rel="stylesheet" href="day1.css" />
    <style>
      h1 {
        color: rgb(255, 136, 0);
        text-align: center;
      }
      p {
        color: green;
        font-size: 24px;
        text-align: center;
        /* text bold */
      }
      #description {
        font-weight: bold;
      }

      .title {
        font-family: Arial, sans-serif;
        font-size: 20px;
        color: blue;
      }
      .note {
        font-style: italic;
        color: gray;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Welcome to Day 1 of CSS!</h1>
    <p class="title">This is a simple paragraph to demonstrate basic CSS styling.</p>

    <p id="description">
      CSS allows you to change the appearance of your HTML elements, such as
      colors, fonts, and layout.
    </p>

    <p class="note">
      Feel free to experiment with different styles and see how they affect the
      look of your webpage!
    </p>
  </body>
</html>
